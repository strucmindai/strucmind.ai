  <body>
    <div id="root"></div>
    <!--
      Hidden static forms so Netlify detects them at deploy time.
      The React app posts url-encoded data with a matching form-name
      (ContactSection -> "contact", PricingSection -> "quote-request").
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form name="quote-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="industry" />
      <input type="text" name="tier" />
      <textarea name="challenge"></textarea>
      <input type="text" name="bot-field" />
    </form>
