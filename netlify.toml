[build]
  publish = "."

# Note: 404.html at the root is served automatically by Netlify
# for any unmatched URL with proper 404 status — no SPA fallback needed.

# ── Legal pages (prerendered) ───────────────────────────────
# These routes are prerendered to real HTML at build time so that crawlers
# which do not execute JavaScript — such as facebookexternalhit, used by Meta
# for business verification and App Review — receive the full document. Serve
# the prerendered file rather than the SPA shell. No /* catch-all, so unknown
# URLs still get 404.html with a real 404 status.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/data-deletion"
  to = "/data-deletion.html"
  status = 200

# Send the underlying .html paths to the canonical URL. Without this they are
# reachable directly, and the router would then see "/privacy.html", match no
# route and render the 404 page over the prerendered content.
[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/data-deletion.html"
  to = "/data-deletion"
  status = 301

# ── Security headers (apply to every response) ──────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ── Long cache for static assets ────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always revalidate so updates show immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
