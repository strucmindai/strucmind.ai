[build]
  publish = "."

# Note: 404.html at the root is served automatically by Netlify
# for any unmatched URL with proper 404 status — no SPA fallback needed.

# ── Client-side routes ──────────────────────────────────────
# The site is a single-page app: these paths have no file on disk and must
# be rewritten to index.html so the router can render them. Listed one by
# one rather than a /* catch-all so that genuinely unknown URLs still get
# 404.html with a real 404 status.
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/data-deletion"
  to = "/index.html"
  status = 200

# ── Security headers (apply to every response) ──────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ── Long cache for static assets ────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always revalidate so updates show immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
